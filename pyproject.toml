[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-resilient-runtime"
version = "0.1.0"
description = "SQLite durable workflows with atomic local effects and crash-recovery evaluation"
requires-python = ">=3.11"
dependencies = []

readme = "README.md"
license = "MIT"

[project.scripts]
resilient-runtime = "resilient_runtime.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
